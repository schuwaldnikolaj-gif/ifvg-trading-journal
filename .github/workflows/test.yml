name: Journal tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run test:browser
      - run: node --check journal-features.js && node --check journal-pro.js && node --check ui.js && node --check journal-cloud.js && node --check sync-core.js && node --check sw.js
