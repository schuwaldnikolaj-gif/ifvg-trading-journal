<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0f">
<link rel="manifest" href="manifest.json">
<title>IFVG Trading Journal</title>
<style>
:root{--bg:#080a0f;--card:#11151d;--muted:#8b93a3;--text:#f4f6f8;--line:#252b36;--green:#36d17c;--red:#ff5d6c;--accent:#7c6cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:22px;font-weight:850}.brand span{color:var(--accent)}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:750;cursor:pointer}.secondary{background:#252b36}.danger{background:#8f2633}.actionsTop{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{font-size:22px;font-weight:850;margin-top:6px}.pos{color:var(--green)}.neg{color:var(--red)}.layout{display:grid;grid-template-columns:1.45fr .8fr;gap:14px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month{font-size:19px;font-weight:800}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:var(--muted);font-size:11px}.day{min-height:82px;border:1px solid var(--line);border-radius:9px;padding:7px;background:#0d1016;cursor:pointer}.day:hover{border-color:#454e60}.selected{outline:2px solid var(--accent)}.num{font-size:12px;color:var(--muted)}.pnl{font-weight:800;margin-top:13px}.trade{border-bottom:1px solid var(--line);padding:12px 0}.trade:last-child{border:0}.tradeRow{display:flex;justify-content:space-between;gap:10px}.small{font-size:12px;color:var(--muted);line-height:1.5}.empty{color:var(--muted);padding:28px 0;text-align:center}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.form{width:min(820px,100%);max-height:95vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.form h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0b0e14;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.field textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#0b0e14;padding:11px;border-radius:10px}.check{font-size:13px}.preview{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:none}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.pill{display:inline-block;background:#202633;border-radius:999px;padding:4px 8px;font-size:11px;margin:3px 3px 0 0}
@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.checks{grid-template-columns:1fr}.app{padding:12px}.actionsTop button{padding:9px}.day{min-height:68px}}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div class="brand">IFVG <span>Trading Journal</span></div>
  <div class="actionsTop">
    <button class="secondary" onclick="exportData()">Backup</button>
    <button onclick="openModal()">+ Trade</button>
  </div>
</div>
<div class="stats" id="stats"></div><div class="card" id="insights" style="margin-bottom:14px"></div>
<div class="layout">
<section class="card">
<div class="calendar-head"><button class="secondary" onclick="changeMonth(-1)">‹</button><div class="month" id="month"></div><button class="secondary" onclick="changeMonth(1)">›</button></div>
<div class="week"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div>
<div class="days" id="calendar"></div>
</section>
<aside class="card"><h3 id="detailTitle">Tag auswählen</h3><div id="details" class="empty">Klicke auf einen Tag im Kalender.</div></aside>
</div>
</div>

<div class="modal" id="modal"><div class="form">
<h2>Trade hinzufügen</h2>
<div class="grid">
<div class="field"><label>Datum</label><input id="date" type="date"></div>
<div class="field"><label>Uhrzeit</label><input id="time" type="time"></div>
<div class="field"><label>Account</label><input id="account" placeholder="z.B. Funded 50K"></div>
<div class="field"><label>Instrument</label><select id="instrument"><option>NQ</option><option>MNQ</option><option>ES</option><option>MES</option><option>YM</option><option>MYM</option></select></div>
<div class="field"><label>Richtung</label><select id="direction"><option>Long</option><option>Short</option></select></div>
<div class="field"><label>Session</label><select id="session"><option>NY Open</option><option>NY AM</option><option>NY PM</option><option>Late Night</option></select></div>
<div class="field"><label>Setup</label><select id="setup"><option>A+</option><option>A</option><option>B</option></select></div>
<div class="field"><label>Bias</label><select id="bias"><option>Bullish</option><option>Bearish</option><option>Neutral</option></select></div>
<div class="field"><label>Risiko ($)</label><input id="risk" type="number" value="250"></div>
<div class="field"><label>Entry</label><input id="entry" type="number" step="0.25"></div>
<div class="field"><label>Stop Loss</label><input id="sl" type="number" step="0.25"></div>
<div class="field"><label>Take Profit</label><input id="tp" type="number" step="0.25"></div>
<div class="field"><label>Ergebnis ($)</label><input id="result" type="number" placeholder="z.B. 495"></div>
<div class="field"><label>R-Multiple</label><input id="r" type="number" step="0.01" placeholder="wird automatisch berechnet"></div>
<div class="field full"><label>IFVG / Setup-Check</label><div class="checks">
<label class="check"><input type="checkbox" id="htf"> HTF Bias bestätigt</label>
<label class="check"><input type="checkbox" id="ifvg"> IFVG</label>
<label class="check"><input type="checkbox" id="sweep"> Liquidity Sweep</label>
<label class="check"><input type="checkbox" id="disp"> Displacement</label>
<label class="check"><input type="checkbox" id="smt"> SMT</label>
<label class="check"><input type="checkbox" id="orderflow"> Orderflow</label>
<label class="check"><input type="checkbox" id="rulebreak"> Regelbruch</label>
<label class="check"><input type="checkbox" id="emotional"> Emotional gehandelt</label>
<label class="check"><input type="checkbox" id="revenge"> Revenge Trade</label>
</div></div>
<div class="field full"><label>A+ Setup Score</label><div id="scoreBox" class="card" style="padding:10px;margin-top:4px"><b id="scoreText">0/6 · noch nicht bewertet</b><div class="small">A+ Kernkriterien: HTF Bias, IFVG, Liquidity Sweep, Displacement, SMT, Orderflow</div></div></div>
<div class="field full"><label>Chart-Screenshot</label><input id="image" type="file" accept="image/*" onchange="previewImage()"><img id="preview" class="preview"></div>
<div class="field full"><label>Trade-Notiz</label><textarea id="note" placeholder="Warum war der Trade valide? Was würdest du beim nächsten Mal anders machen?"></textarea></div>
</div>
<div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button onclick="saveTrade()">Trade speichern</button></div>
</div></div>

<script>
let trades=JSON.parse(localStorage.getItem("ifvgTrades")||"[]"),view=new Date(),selected=null,imageData="";
const $=id=>document.getElementById(id);
function money(n){return (n>=0?"+":"")+n.toFixed(0)+" $"} function rOf(t){return t.risk?Number(t.result||0)/Number(t.risk):Number(t.r||0)}

function analytics(){
 if(!trades.length)return{aPlus:"–",ruleLoss:0,revengeLoss:0,bestSession:"–",scoreWinrate:"–",criteria:[]};
 const a=trades.filter(t=>t.setup==="A+"), aw=a.filter(t=>Number(t.result)>0).length;
 const ruleLoss=trades.filter(t=>t.rulebreak).reduce((x,t)=>x+Number(t.result||0),0);
 const revengeLoss=trades.filter(t=>t.revenge).reduce((x,t)=>x+Number(t.result||0),0);
 const sessions={}; trades.forEach(t=>sessions[t.session]=(sessions[t.session]||0)+Number(t.result||0));
 const bestSession=Object.entries(sessions).sort((a,b)=>b[1]-a[1])[0]?.[0]||"–";
 const ids=["htf","ifvg","sweep","disp","smt","orderflow"], labels={htf:"HTF Bias",ifvg:"IFVG",sweep:"Sweep",disp:"Displacement",smt:"SMT",orderflow:"Orderflow"};
 const criteria=ids.map(id=>{const ts=trades.filter(t=>t[id]); const wins=ts.filter(t=>Number(t.result)>0).length; return {label:labels[id],n:ts.length,wr:ts.length?Math.round(wins/ts.length*100):0,pnl:ts.reduce((x,t)=>x+Number(t.result||0),0)};});
 const scored=trades.filter(t=>ids.filter(k=>t[k]).length>=5);
 const sw=scored.filter(t=>Number(t.result)>0).length;
 return{aPlus:a.length?Math.round(aw/a.length*100)+"%":"–",ruleLoss,revengeLoss,bestSession,scoreWinrate:scored.length?Math.round(sw/scored.length*100)+"%":"–",criteria};
}
function updateRPreview(){const risk=Number($("risk").value)||0,result=Number($("result").value)||0;$("r").value=risk?(result/risk).toFixed(2):"";}
function render(){
 const y=view.getFullYear(),m=view.getMonth(); $("month").textContent=view.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
 const first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7;let html="";
 for(let i=0;i<start;i++)html+="<div></div>";
 for(let d=1;d<=last.getDate();d++){const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,ts=trades.filter(t=>t.date===key),p=ts.reduce((a,t)=>a+Number(t.result||0),0);
 html+=`<div class="day ${selected===key?"selected":""}" onclick="selectDay('${key}')"><div class="num">${d}</div>${ts.length?`<div class="pnl ${p>=0?"pos":"neg"}">${money(p)}</div><div class="small">${ts.length} Trade${ts.length>1?"s":""}</div>`:""}</div>`}
 $("calendar").innerHTML=html;
 const total=trades.reduce((a,t)=>a+Number(t.result||0),0),wins=trades.filter(t=>Number(t.result)>0).length,rs=trades.reduce((a,t)=>a+rOf(t),0);
 const gw=trades.filter(t=>t.result>0).reduce((a,t)=>a+Number(t.result),0),gl=Math.abs(trades.filter(t=>t.result<0).reduce((a,t)=>a+Number(t.result),0)),pf=gl?gw/gl:0;
 $("stats").innerHTML=`<div class="card"><div class="label">P&L</div><div class="value ${total>=0?"pos":"neg"}">${money(total)}</div></div><div class="card"><div class="label">Trades</div><div class="value">${trades.length}</div></div><div class="card"><div class="label">Winrate</div><div class="value">${trades.length?(wins/trades.length*100).toFixed(0):0}%</div></div><div class="card"><div class="label">Profit Factor</div><div class="value">${pf?pf.toFixed(2):"–"}</div></div><div class="card"><div class="label">Total R</div><div class="value ${rs>=0?"pos":"neg"}">${rs.toFixed(2)}R</div></div><div class="card"><div class="label">Regelbrüche</div><div class="value neg">${trades.filter(t=>t.rulebreak).length}</div></div>`;
 const ai=analytics();
 $("insights").innerHTML=`<b>Performance Insights</b><div class="small" style="margin-top:8px">A+ Winrate: <b>${ai.aPlus}</b> · 5+/6 Score Winrate: <b>${ai.scoreWinrate}</b> · Regelbrüche: <b class="${ai.ruleLoss<=0?"neg":"pos"}">${money(ai.ruleLoss)}</b> · Revenge Trades: <b class="${ai.revengeLoss<=0?"neg":"pos"}">${money(ai.revengeLoss)}</b> · Beste Session: <b>${ai.bestSession}</b></div><div class="small" style="margin-top:8px">Kriterien: ${ai.criteria.map(c=>`${c.label} ${c.n?c.wr+"% WR":"–"}`).join(" · ")}</div>`;
}
function selectDay(key){selected=key;render();const ts=trades.filter(t=>t.date===key);$("detailTitle").textContent=new Date(key+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"});$("details").innerHTML=ts.length?ts.map((t,i)=>`<div class="trade"><div class="tradeRow"><div><b>${t.instrument} ${t.direction}</b><div class="small">${t.account||"Kein Account"} · ${t.time||"--:--"} · ${t.session}</div><div>${t.setup} · ${t.bias}</div></div><div class="${t.result>=0?"pos":"neg"}"><b>${money(Number(t.result))}</b><div class="small">${rOf(t).toFixed(2)}R</div></div></div><div>${t.ifvg?'<span class="pill">IFVG</span>':""}${t.sweep?'<span class="pill">Sweep</span>':""}${t.disp?'<span class="pill">Displacement</span>':""}${t.smt?'<span class="pill">SMT</span>':""}${t.rulebreak?'<span class="pill">⚠ Regelbruch</span>':""}${t.emotional?'<span class="pill">Emotion</span>':""}</div><div class="small" style="margin-top:7px">${t.note||""}</div>${t.image?`<img src="${t.image}" style="max-width:100%;max-height:180px;border-radius:9px;margin-top:8px">`:""}<button class="danger" style="margin-top:8px;padding:7px 10px" onclick="deleteTrade(${i},'${key}')">Trade löschen</button></div>`).join(""):`<div class="empty">Keine Trades an diesem Tag.</div>`}
function changeMonth(n){view.setMonth(view.getMonth()+n);selected=null;render()}
function openModal(){$("date").value=selected||new Date().toISOString().slice(0,10);$("time").value="15:30";setupScore();$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show");imageData="";$("image").value="";$("preview").style.display="none"}
function setupScore(){
 const ids=["htf","ifvg","sweep","disp","smt","orderflow"];
 const n=ids.filter(id=>$(id).checked).length;
 const label=n>=5?"A+ · sehr stark":n===4?"A · solide":n===3?"B · mittel":"C · unvollständig";
 $("scoreText").textContent=`${n}/6 · ${label}`;
 $("scoreBox").className="card "+(n>=5?"pos":"");
}
["htf","ifvg","sweep","disp","smt","orderflow"].forEach(id=>$(id).addEventListener("change",setupScore));
function previewImage(){const f=$("image").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;$("preview").src=imageData;$("preview").style.display="block"};r.readAsDataURL(f)}
$("risk").addEventListener("input",updateRPreview); $("result").addEventListener("input",updateRPreview);
function saveTrade(){
 const risk=Number($("risk").value)||0,result=Number($("result").value)||0;
 const t={id:Date.now(),date:$("date").value,time:$("time").value,account:$("account").value,instrument:$("instrument").value,direction:$("direction").value,session:$("session").value,setup:$("setup").value,bias:$("bias").value,risk,entry:$("entry").value,sl:$("sl").value,tp:$("tp").value,result,r:risk?result/risk:Number($("r").value)||0,htf:$("htf").checked,ifvg:$("ifvg").checked,sweep:$("sweep").checked,disp:$("disp").checked,smt:$("smt").checked,orderflow:$("orderflow").checked,rulebreak:$("rulebreak").checked,emotional:$("emotional").checked,revenge:$("revenge").checked,note:$("note").value,image:imageData};
 trades.push(t);localStorage.setItem("ifvgTrades",JSON.stringify(trades));view=new Date(t.date+"T12:00:00");selected=t.date;closeModal();render();selectDay(t.date);
}
function deleteTrade(i,key){const dayTrades=trades.filter(t=>t.date===key),id=dayTrades[i]?.id;if(!confirm("Trade wirklich löschen?"))return;trades=trades.filter(t=>t.id!==id);localStorage.setItem("ifvgTrades",JSON.stringify(trades));selectDay(key)}
function importData(){const input=document.createElement("input");input.type="file";input.accept="application/json";input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw new Error();trades=data;localStorage.setItem("ifvgTrades",JSON.stringify(trades));selected=null;render();alert("Backup erfolgreich wiederhergestellt.");}catch(e){alert("Ungültige Backup-Datei.");}};r.readAsText(f)};input.click()}
function exportData(){const blob=new Blob([JSON.stringify(trades,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ifvg-trading-journal-backup.json";a.click();URL.revokeObjectURL(a.href)}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
